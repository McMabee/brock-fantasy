project_id = "brock-fantasy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["brockfantasy://**", "http://localhost:8081/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.ingest-sports-data]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.dispatch-push-notifications]
verify_jwt = true
